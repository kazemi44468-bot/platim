name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build shared Platim shell
        shell: bash
        run: |
          cat > /tmp/shell.css <<'EOF'
          .site-header{position:sticky;top:0;z-index:100;background:rgba(251,250,246,.96);backdrop-filter:blur(18px);border-bottom:1px solid rgba(20,59,42,.13);box-shadow:0 8px 30px rgba(20,59,42,.035)}.header-grain-line{height:3px;background:linear-gradient(90deg,transparent 0 8%,#b99a56 8% 12%,transparent 12% 20%,#143b2a 20% 50%,transparent 50% 80%,#b99a56 80% 84%,transparent 84%)}.topbar{height:82px;display:flex;align-items:center;gap:18px}.brand{display:flex;align-items:center;gap:12px;color:#143b2a;text-decoration:none;min-width:205px}.brand-mark{width:50px;height:58px;display:grid;place-items:center;position:relative}.grain-mark{width:23px;height:49px;border-radius:80% 38% 80% 44%;background:linear-gradient(145deg,#fff6d8,#b99a56);transform:rotate(39deg);box-shadow:inset 3px -4px 7px rgba(60,40,10,.16);position:relative}.grain-mark:before{content:"";position:absolute;left:50%;top:8%;height:78%;width:1px;background:rgba(70,45,10,.22)}.grain-mark:after{content:"";position:absolute;inset:12% 18%;border:1px solid rgba(70,45,10,.12);border-radius:50%}.brand-name{font-size:24px;font-weight:950;display:block;line-height:1.1}.brand-en{display:block;color:#b99a56;font-size:7px;letter-spacing:.16em;direction:ltr;margin-top:4px}.desktop-nav{display:flex;justify-content:center;align-items:center;gap:2px;flex:1}.nav-item{display:inline-flex!important;align-items:center;gap:5px;padding:11px 12px;border:0;background:transparent;border-radius:12px;color:#1b241f;text-decoration:none;font:800 11px Vazirmatn,Arial,sans-serif;cursor:pointer;transition:.22s}.nav-item:hover,.nav-dropdown.open>.nav-trigger{background:#f5efe3;color:#143b2a}.nav-trigger i{font-style:normal;color:#b99a56;font-size:13px;transition:.2s}.nav-dropdown.open .nav-trigger i{transform:rotate(180deg)}.nav-dropdown{position:relative}.nav-panel{position:absolute;top:calc(100% + 11px);right:50%;width:305px;transform:translateX(50%) translateY(8px);opacity:0;visibility:hidden;pointer-events:none;background:rgba(251,250,246,.99);border:1px solid rgba(20,59,42,.12);border-radius:20px;padding:9px;box-shadow:0 24px 65px rgba(20,59,42,.16);transition:.2s}.nav-dropdown:hover .nav-panel,.nav-dropdown.open .nav-panel{opacity:1;visibility:visible;pointer-events:auto;transform:translateX(50%) translateY(0)}.nav-panel a{display:flex;gap:11px;align-items:center;text-decoration:none;color:#1b241f;padding:11px;border-radius:14px}.nav-panel a:hover{background:#f5efe3}.nav-panel b{display:block;color:#143b2a;font-size:11px}.nav-panel small{display:block;color:#68736d;font-size:8px;line-height:1.8}.nav-icon,.mobile-icon{width:35px;height:35px;display:grid;place-items:center;flex:none;border-radius:11px;background:linear-gradient(145deg,#fff,#f5efe3);border:1px solid rgba(185,154,86,.3);color:#b99a56;font-style:normal}.header-actions{display:flex;align-items:center;gap:7px}.verify-link,.shop-link{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 13px;border-radius:999px;text-decoration:none;font-size:10px;font-weight:900}.verify-link{border:1px solid rgba(20,59,42,.15);color:#143b2a;background:#fff}.shop-link{background:#143b2a;color:#fff}.shop-link b{color:#b99a56;font-size:15px}.menu-toggle{width:42px;height:42px;border:1px solid rgba(20,59,42,.15);background:#fff;border-radius:13px;display:none;flex-direction:column;justify-content:center;gap:5px;padding:9px}.menu-toggle span{width:20px;height:1.5px;background:#143b2a;display:block;margin:auto}.header-sub{border-top:1px solid rgba(20,59,42,.05);background:#f5efe3}.header-sub>.container{height:34px;display:flex;align-items:center;justify-content:space-between;color:#68736d;font-size:9px}.header-sub i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#b99a56;margin-left:5px}.header-sub a{color:#68736d;text-decoration:none;margin-right:20px}.mobile-menu{display:none}.site-footer{position:relative;overflow:hidden;background:#102f22;color:#fff;margin-top:0}.footer-grain-field{position:absolute;inset:0;opacity:.09;pointer-events:none}.footer-grain-field span{position:absolute;width:180px;height:340px;border:1px solid #d7bd7a;border-radius:80% 38% 80% 44%;transform:rotate(38deg)}.footer-grain-field span:nth-child(1){right:4%;top:-160px}.footer-grain-field span:nth-child(2){right:25%;bottom:-220px;transform:rotate(-35deg)}.footer-grain-field span:nth-child(3){left:16%;top:-220px;transform:rotate(48deg)}.footer-grain-field span:nth-child(4){left:42%;bottom:-260px;transform:rotate(-25deg)}.footer-grain-field span:nth-child(5){left:-4%;top:40px;transform:rotate(25deg)}.footer-main{position:relative;z-index:1;display:grid;grid-template-columns:1.8fr 1fr 1fr 1fr;gap:45px;padding:72px 0 45px}.footer-logo{display:flex;align-items:center;gap:12px}.footer-logo img{width:52px;height:52px;object-fit:contain;background:#fff;border-radius:15px;padding:5px}.footer-logo strong{display:block;font-size:24px}.footer-logo small{display:block;color:#b99a56;font-size:7px;letter-spacing:.12em;direction:ltr;margin-top:4px}.footer-brand p{max-width:470px;color:rgba(255,255,255,.66);font-size:11px;line-height:2.1;margin:20px 0}.footer-cta{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-size:10px;font-weight:900;border-bottom:1px solid rgba(185,154,86,.65);padding-bottom:7px}.footer-cta b{color:#b99a56;font-size:15px}.footer-col{display:flex;flex-direction:column;gap:10px}.footer-col>strong{color:#b99a56;font-size:11px;margin-bottom:7px}.footer-col a{color:rgba(255,255,255,.67);text-decoration:none;font-size:10px;transition:.2s}.footer-col a:hover{color:#fff;transform:translateX(-3px)}.footer-rice-note{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);padding:19px 0;display:flex;align-items:center;justify-content:space-between}.footer-rice-note>div{display:flex;align-items:center;gap:12px}.footer-grain{display:block;width:18px;height:37px;border-radius:80% 38% 80% 44%;background:linear-gradient(145deg,#fff4ce,#b99a56);transform:rotate(38deg)}.footer-rice-note b{display:block;font-size:11px}.footer-rice-note small{display:block;color:#b99a56;font-size:8px}.footer-rice-note p{color:rgba(255,255,255,.5);font-size:9px;margin:0}.footer-bottom{position:relative;z-index:1;min-height:55px;display:flex;align-items:center;justify-content:space-between;color:rgba(255,255,255,.4);font-size:8px;direction:rtl}.back-to-top{position:fixed;bottom:22px;left:22px;z-index:90;width:43px;height:43px;border:1px solid rgba(185,154,86,.5);border-radius:50%;background:#143b2a;color:#b99a56;opacity:0;visibility:hidden;transform:translateY(10px);transition:.25s;cursor:pointer}.back-to-top.visible{opacity:1;visibility:visible;transform:none}@media(max-width:1120px){.desktop-nav{display:none}.menu-toggle{display:flex}.header-actions .shop-link{display:none}.topbar{height:76px}.header-sub>.container{height:30px}.mobile-menu{max-height:calc(100vh - 106px);overflow:auto;background:#fbfaf6;border-top:1px solid rgba(20,59,42,.12);padding:10px 20px 22px}.mobile-menu.open{display:block}.mobile-menu>a,.mobile-menu>details{border-bottom:1px solid rgba(20,59,42,.08)}.mobile-menu>a,.mobile-menu summary{min-height:51px;display:flex;align-items:center;justify-content:space-between;color:#1b241f;text-decoration:none;font-size:11px;font-weight:850}.mobile-menu summary{list-style:none}.mobile-menu summary::-webkit-details-marker{display:none}.mobile-menu summary>span{display:flex;align-items:center;gap:9px}.mobile-menu summary b{color:#b99a56}.mobile-menu details>div{padding:0 12px 8px}.mobile-menu details a{display:block;color:#68736d;text-decoration:none;padding:8px 40px 8px 8px;font-size:10px}.mobile-feature{display:flex!important;justify-content:center!important;margin-top:10px;padding:12px!important;border:1px solid rgba(185,154,86,.35)!important;border-radius:14px!important;color:#143b2a!important;background:#fff}.mobile-feature.filled{background:#143b2a;color:#fff!important;border-color:#143b2a!important;justify-content:space-between!important}.mobile-feature.filled b{color:#b99a56}}@media(max-width:650px){.container{width:calc(100% - 30px)}.brand{min-width:0}.brand-name{font-size:20px}.brand-en{font-size:6px}.brand-mark{width:43px}.header-actions{margin-right:auto}.verify-link{display:none}.header-sub>.container>div{display:none}.footer-main{grid-template-columns:1fr 1fr;gap:30px;padding:52px 0 35px}.footer-brand{grid-column:1/-1}.footer-rice-note{display:block}.footer-rice-note p{margin-top:10px}.footer-bottom{min-height:70px;gap:10px;flex-direction:column;justify-content:center;text-align:center}.back-to-top{left:15px;bottom:15px}}
          EOF
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          header=Path('components/header.html').read_text(encoding='utf-8')
          footer=Path('components/footer.html').read_text(encoding='utf-8')
          css=Path('/tmp/shell.css').read_text(encoding='utf-8')
          for p in root.rglob('*.html'):
              if str(p).startswith('components/'):
                  continue
              text=p.read_text(encoding='utf-8')
              depth=len(p.parent.parts)
              prefix='../'*depth
              h=re.sub(r'href="/','href="'+prefix,header)
              h=re.sub(r'src="/','src="'+prefix,h)
              f=re.sub(r'href="/','href="'+prefix,footer)
              f=re.sub(r'src="/','src="'+prefix,f)
              text=re.sub(r'<header\b[^>]*class=["\'][^"\']*site-header[^"\']*["\'][^>]*>.*?</header>',h,text,count=1,flags=re.S|re.I)
              if 'site-header' not in text:
                  text=re.sub(r'(<body\b[^>]*>)',r'\1'+h,text,count=1,flags=re.I)
              text=re.sub(r'<footer\b[^>]*class=["\'][^"\']*site-footer[^"\']*["\'][^>]*>.*?</footer>',f,text,count=1,flags=re.S|re.I)
              if 'site-footer' not in text:
                  text=text.replace('</body>',f+'</body>')
              if 'components/shell.css' not in text:
                  text=text.replace('</head>',f'<style>{css}</style></head>')
              if 'assets/js/app.js' not in text:
                  text=text.replace('</body>',f'<button class="back-to-top" type="button" aria-label="بازگشت به بالا">↑</button><script src="{prefix}assets/js/app.js" defer></script></body>')
              p.write_text(text,encoding='utf-8')
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
